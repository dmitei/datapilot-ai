services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: datapilot
      POSTGRES_DB: datapilot
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - bank_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U datapilot -d datapilot"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  bank_data:
